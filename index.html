<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Téléchargements</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212b;--line:#272c38;--text:#e8eaf0;--muted:#8d95a6;--accent:#4ade80;--accent-ink:#07210f;--danger:#f87171;--r:14px}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--panel:#fff;--panel2:#f0f2f6;--line:#dfe3ea;--text:#14171f;--muted:#6a7385;--accent:#16a34a;--accent-ink:#fff;--danger:#dc2626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.group{margin-bottom:26px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 8px}
.ghead h2{font-size:17px;margin:0}
.ghead span{color:var(--muted);font-size:13px;white-space:nowrap}
.note{color:var(--muted);font-size:14px;margin:0 4px 8px;white-space:pre-line}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.file{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.meta{min-width:0;flex:1}
.name{font-weight:600;overflow-wrap:anywhere}
.info{color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.state{padding:36px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.state code{background:var(--panel2);padding:2px 6px;border-radius:6px;color:var(--text)}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted)}
@media(max-width:520px){.file{flex-wrap:wrap}.acts{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1 id="title">Téléchargements</h1><p class="sub" id="subtitle">Mods, packs et fichiers à récupérer.</p></div>
  <a class="btn" id="admin" href="#" target="_blank" rel="noopener" hidden>🔒 Admin</a>
</header>
<main id="main"><div class="state">Chargement…</div></main>
<footer id="foot"></footer>
</div>

<script>
/* ====== RÉGLAGES ======
   Laisse REPO vide si le site est sur  https://TON-PSEUDO.github.io/NOM-DU-DEPOT/
   (il se règle tout seul). Sinon écris-le : "ton-pseudo/nom-du-depot". */
const REPO = "";
const TITLE = "Téléchargements";
const SUBTITLE = "Mods, packs et fichiers à récupérer.";
/* ======================= */

const $ = id => document.getElementById(id);
document.title = TITLE; $("title").textContent = TITLE; $("subtitle").textContent = SUBTITLE;

function detectRepo() {
  const q = new URLSearchParams(location.search).get("repo");
  if (q && /^[\w.-]+\/[\w.-]+$/.test(q)) return q;
  if (REPO) return REPO;
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/i);
  if (m) { const seg = location.pathname.split("/").filter(Boolean)[0]; return m[1] + "/" + (seg && !seg.includes(".") ? seg : m[1] + ".github.io"); }
  return "";
}
const repo = detectRepo();

const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2).replace(".", ",") + " Go"
               : b >= 1048576 ? (b/1048576).toFixed(1).replace(".", ",") + " Mo"
               : b >= 1024 ? Math.round(b/1024) + " Ko" : b + " o";
const day = s => new Date(s).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"});
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function state(html) { const d = el("div", "state"); d.append(...html); $("main").replaceChildren(d); }

async function load() {
  if (!repo) {
    return state([document.createTextNode("Dépôt GitHub non réglé. Ouvre "), el("code", "", "index.html"),
      document.createTextNode(" et écris ton dépôt dans REPO (exemple : "), el("code", "", "mon-pseudo/mon-depot"), document.createTextNode(").")]);
  }
  $("admin").href = "https://github.com/" + repo + "/releases/new"; $("admin").hidden = false;
  const key = "rel:" + repo; let data = null;
  try { const c = JSON.parse(sessionStorage.getItem(key) || "null"); if (c && Date.now() - c.t < 300000) data = c.d; } catch (e) {}
  if (!data) {
    let r;
    try { r = await fetch("https://api.github.com/repos/" + repo + "/releases?per_page=50", {headers: {Accept: "application/vnd.github+json"}}); }
    catch (e) { return state([document.createTextNode("Impossible de joindre GitHub. Vérifie ta connexion et réessaie.")]); }
    if (r.status === 404) return state([document.createTextNode("Dépôt introuvable ou privé : "), el("code", "", repo), document.createTextNode(". Il doit être public.")]);
    if (r.status === 403 || r.status === 429) return state([document.createTextNode("GitHub limite le nombre de visites pour l'instant. Réessaie dans quelques minutes.")]);
    if (!r.ok) return state([document.createTextNode("Erreur GitHub (" + r.status + ").")]);
    data = await r.json();
    try { sessionStorage.setItem(key, JSON.stringify({t: Date.now(), d: data})); } catch (e) {}
  }
  render(data);
}

function render(releases) {
  const main = $("main"); main.replaceChildren(); let total = 0;
  for (const rel of releases) {
    if (rel.draft || !rel.assets || !rel.assets.length) continue;
    const g = el("section", "group"), head = el("div", "ghead");
    head.append(el("h2", "", rel.name || rel.tag_name), el("span", "", day(rel.published_at || rel.created_at)));
    g.append(head);
    if (rel.body && rel.body.trim()) g.append(el("p", "note", rel.body.trim().slice(0, 400)));
    const card = el("div", "card");
    for (const a of rel.assets) {
      total++;
      const row = el("div", "file"), ext = (a.name.split(".").pop() || "fic").slice(0, 4);
      const meta = el("div", "meta"), n = a.download_count || 0;
      meta.append(el("div", "name", a.name), el("div", "info", fmt(a.size) + " · " + day(a.updated_at) + " · " + n + " téléchargement" + (n > 1 ? "s" : "")));
      const acts = el("div", "acts"), dl = el("a", "btn primary", "Télécharger"); dl.href = a.browser_download_url;
      const cp = el("button", "btn", "Copier le lien"); cp.type = "button";
      cp.onclick = async () => { try { await navigator.clipboard.writeText(a.browser_download_url); cp.textContent = "Copié ✓"; setTimeout(() => cp.textContent = "Copier le lien", 1500); } catch (e) { prompt("Copie ce lien :", a.browser_download_url); } };
      acts.append(dl, cp); row.append(el("div", "ico", ext), meta, acts); card.append(row);
    }
    g.append(card); main.append(g);
  }
  if (!total) return state([document.createTextNode("Aucun fichier pour l'instant.")]);
  $("foot").textContent = total + " fichier" + (total > 1 ? "s" : "");
}
load();
</script>
</body>
</html>
